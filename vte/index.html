<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12385c">
<title>VTE Piping Inspection</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <button id="backBtn" class="icon-btn" aria-label="Back" hidden>&#8592;</button>
  <div id="titleWrap"><div id="title">VTE Piping Inspection</div><div id="subtitle"></div></div>
  <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
  <span id="saveState" title="Saved on this device"></span>
</header>
<nav id="stepper" hidden></nav>
<main id="main"></main>
<footer id="bottombar" hidden>
  <button id="prevBtn" class="btn ghost">&#8249; Back</button>
  <span id="stepCount"></span>
  <button id="nextBtn" class="btn primary">Next &#8250;</button>
</footer>
<button id="drwFab" hidden aria-label="Drawings and previous ECH">📐<b></b></button>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGallery" accept="image/*" multiple hidden>
<input type="file" id="fileDrawing" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="fileLines" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>
<input type="file" id="filePids" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="fileEch" accept="application/pdf,.pdf" hidden>
<input type="file" id="filePack" accept="application/json,.json" hidden>
<input type="file" id="fileBackup" accept="application/json,.json" hidden>
<script src="vendor/docx.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="pipedims.js"></script>
<script src="pipeclasses.js"></script>
<script src="checklist.js"></script>
<script src="report.js"></script>
<script src="ech.js"></script>
<script src="viewer.js"></script>
<script src="isotool.js"></script>
<script src="app.js"></script>
</body>
</html>
