<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f5c">
<title>Inspection Toolbox</title>
<link rel="manifest" href="manifest.webmanifest?v=black">
<link rel="icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Inspection Toolbox">
<meta name="application-name" content="Inspection Toolbox">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="navshade b" aria-hidden="true"></div><div class="navshade l" aria-hidden="true"></div><div class="navshade r" aria-hidden="true"></div>
<header id="topbar">
  <button id="backBtn" class="icon-btn" aria-label="Back" hidden>&#8592;</button>
  <button id="homeBtn" class="icon-btn" aria-label="Home" title="Home" hidden>&#8962;</button>
  <div id="titleWrap"><div id="title">Inspection Toolbox</div><div id="subtitle"></div></div>
  <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
  <span id="saveState" title="Saved on this device"></span>
</header>
<button id="resumeBar" hidden></button>
<nav id="stepper" hidden></nav>
<main id="main"></main>
<footer id="bottombar" hidden>
  <button id="prevBtn" class="btn ghost">&#8249; Back</button>
  <span id="stepCount"></span>
  <button id="nextBtn" class="btn primary">Next &#8250;</button>
</footer>
<button id="drwFab" hidden aria-label="Drawings and previous ECH">📐<b></b></button>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGallery" accept="image/*" multiple hidden>
<input type="file" id="fileDrawing" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="fileLines" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>
<input type="file" id="filePids" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="fileEch" accept="application/pdf,.pdf" hidden>
<input type="file" id="filePack" accept="application/json,.json,.zip,application/zip" hidden>
<input type="file" id="fileBackup" accept="application/json,.json" hidden>
<script src="vendor/docx.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="pipedims.js"></script>
<script src="pipeclasses.js"></script>
<script src="checklist.js"></script>
<script src="dm.js"></script>
<script src="report.js"></script>
<script src="ech.js"></script>
<script src="viewer.js"></script>
<script src="isotool.js"></script>
<script src="pdfview.js"></script>
<script src="launch.js"></script>
<script src="tools.js"></script>
<script src="face.js"></script>
<script src="refs.js"></script>
<script src="xray.js"></script>
<script src="help.js"></script>
<script src="app.js"></script>
<script src="echbulk.js"></script>
<script src="prepdrop.js"></script>
<script src="pidapp.js"></script>
<script src="promo.js"></script>
<script src="odrive.js"></script>
<script src="sync.js"></script>
<script src="files.js"></script>
<script src="setup.js"></script>
<script src="packs.js"></script>
</body>
</html>
